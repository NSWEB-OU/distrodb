# Production stack for a self-hosted VPS: Postgres + CMS + web, all on one
# Docker network. Requires a `.env` next to this file (see .env.example) or
# the platform injecting the same variables.
#
# apps/web statically generates pages (glossary, roadmap, distros/[slug],
# vs/[slugs], etc.) at build time from the CMS's REST API, so the CMS must
# already be up and reachable at CMS_URL *before* web is built - bring it up
# in two steps:
#
#   docker compose -f docker-compose.prod.yml up -d --build postgres cms
#   # wait until the cms container is healthy, then optionally seed it:
#   docker compose -f docker-compose.prod.yml run --rm cms pnpm run seed
#   docker compose -f docker-compose.prod.yml run --rm cms pnpm run seed:roadmap
#   docker compose -f docker-compose.prod.yml up -d --build web
#
# On Coolify (or similar platforms that build every service in a compose file
# in one shot), this two-phase order can't be guaranteed with a single combined
# stack - use docker-compose.cms.yml and docker-compose.web.yml as two separate
# resources instead.


services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-distrodb_cms}
    volumes:
      - pgdata:/var/lib/postgresql/data

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-distrodb_cms}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET}
      NODE_ENV: production
      PORT: 3001
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      WEB_URL: http://web:3000
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_REGION: ${S3_REGION:?Set S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/distros?limit=1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        CMS_URL: http://cms:3001
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CMS_URL: http://cms:3001
      NEXT_PUBLIC_MEDIA_HOSTNAME: ${NEXT_PUBLIC_MEDIA_HOSTNAME:?Set NEXT_PUBLIC_MEDIA_HOSTNAME}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
