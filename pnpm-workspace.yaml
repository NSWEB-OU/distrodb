packages:
  - "apps/*"
  - "packages/*"

overrides:
  flatted: ^3.4.2
  dompurify: ^3.4.13
  "@babel/core": ^7.29.6
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  fast-uri: ^3.1.6
  picomatch@2: ^2.3.2
  esbuild: ^0.25.0
  hono: ^4.13.5
  "@hono/node-server": ^1.19.15
  body-parser: ^2.3.0
  express-rate-limit: ^8.2.2
  ip-address: ^10.3.1
  nanoid: ^3.3.18

  path-to-regexp: ^6.3.0
  postcss: ^8.5.23
  qs: ^6.16.0
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  "@vitest/mocker": ^4.1.11
  postcss-selector-parser: ^7.1.3
  "@humanfs/node": ^0.16.8

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
verifyDepsBeforeRun: false
ignoredBuiltDependencies:
