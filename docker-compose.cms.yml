# CMS half of the production stack, deployed as its own Coolify resource so it
# can be built and become healthy *before* the web resource builds - Coolify
# builds every service in a compose file in one shot, so a single combined
# stack (docker-compose.prod.yml) can't guarantee that ordering on its own.
# See docker-compose.web.yml for the other half.
#
# In Coolify: deploy this resource first, assign it a domain/FQDN on port 3001
# (Settings > Domains, e.g. http://cms.yourdomain.com:3001) so the web resource
# can reach it as CMS_URL, then deploy docker-compose.web.yml with CMS_URL set
# to that domain. Don't publish a host port here - Coolify's proxy exposes the
# container port via its own network, and hardcoding one risks clashing with
# other resources on the same server.
#
# For manual single-VPS docker compose deployments (no Coolify), use
# docker-compose.prod.yml instead - it runs both halves on one shared network.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-distrodb_cms}
    volumes:
      - pgdata:/var/lib/postgresql/data

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-distrodb_cms}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET}
      NODE_ENV: production
      PORT: 3001
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_REGION: ${S3_REGION:?Set S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/distros?limit=1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
