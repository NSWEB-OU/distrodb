# Web half of the production stack, deployed as its own Coolify resource
# *after* docker-compose.cms.yml is up and healthy - apps/web statically
# generates several pages from the CMS REST API at build time, so CMS_URL
# must already be reachable when this image builds.
#
# CMS_URL: set to the cms resource's domain/FQDN (Coolify Settings > Domains
# on that resource), e.g. https://cms.yourdomain.com - "http://cms:3001" only
# resolves within docker-compose.prod.yml's single combined stack.
#
# Don't publish a host port here - assign this resource its own domain/FQDN on
# port 3000 via Coolify's proxy instead of hardcoding one, to avoid clashing
# with other resources on the same server.
#
# REVALIDATE_SECRET (optional): must match the cms resource's REVALIDATE_SECRET
# (see docker-compose.cms.yml) so saving/deleting in the admin UI can trigger
# /api/revalidate here immediately instead of waiting out the 1h ISR window.
# Leave unset to disable.
#
# For manual single-VPS docker compose deployments (no Coolify), use
# docker-compose.prod.yml instead - it runs both halves on one shared network.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        CMS_URL: ${CMS_URL:?Set CMS_URL to the reachable cms resource URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CMS_URL: ${CMS_URL:?Set CMS_URL to the reachable cms resource URL}
      NEXT_PUBLIC_MEDIA_HOSTNAME: ${NEXT_PUBLIC_MEDIA_HOSTNAME:?Set NEXT_PUBLIC_MEDIA_HOSTNAME}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
